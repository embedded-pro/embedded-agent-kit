name: sync
on:
  release:
    types: [published]
  workflow_dispatch:
permissions: {}
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.list.outputs.repos }}
    steps:
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: token
        with:
          app-id: ${{ vars.SYNC_APP_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          owner: embedded-pro
      # A consumer is any repository the app can reach that carries .embedded-agent-kit.json.
      - id: list
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          repos=()
          for repo in $(gh api --paginate /installation/repositories --jq '.repositories[] | select(.archived | not) | .full_name'); do
            if gh api "repos/${repo}/contents/.embedded-agent-kit.json" --silent 2>/dev/null; then repos+=("${repo}"); fi
          done
          echo "repos=$(printf '%s\n' "${repos[@]}" | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"
  open-pr:
    needs: plan
    if: needs.plan.outputs.repos != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo: ${{ fromJson(needs.plan.outputs.repos) }}
    steps:
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: token
        with:
          app-id: ${{ vars.SYNC_APP_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          owner: embedded-pro
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: kit
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repo }}
          token: ${{ steps.token.outputs.token }}
          path: consumer
          persist-credentials: false
      - run: python3 kit/scripts/embedded_agent_kit.py sync consumer
      - id: ref
        run: echo "sha=$(git -C kit rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Pin the verify action to this release
        env:
          SHA: ${{ steps.ref.outputs.sha }}
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          find consumer/.github/workflows -name '*.yml' -exec \
            sed -i -E "s|uses: embedded-pro/embedded-agent-kit@[0-9a-f]{40}( # .*)?|uses: embedded-pro/embedded-agent-kit@${SHA} # ${TAG}|" {} +
      - uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          path: consumer
          token: ${{ steps.token.outputs.token }}
          branch: embedded-agent-kit/sync
          title: "chore: sync embedded-agent-kit ${{ github.event.release.tag_name || github.ref_name }}"
          commit-message: "chore: sync embedded-agent-kit ${{ github.event.release.tag_name || github.ref_name }}"
          body: "Generated by embedded-pro/embedded-agent-kit. Edit the shared sections there, not here."
