name: sync
on:
  release:
    types: [published]
  workflow_dispatch:
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.list.outputs.repos }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: echo "repos=$(jq -c 'keys' consumers.json)" >> "$GITHUB_OUTPUT"
  open-pr:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repo: ${{ fromJson(needs.plan.outputs.repos) }}
    steps:
      - uses: actions/create-github-app-token@v1
        id: token
        with:
          app-id: ${{ vars.SYNC_APP_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          owner: embedded-pro
      - uses: actions/checkout@v4
        with:
          path: kit
      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          token: ${{ steps.token.outputs.token }}
          path: consumer
      - run: python3 kit/scripts/embedded_agent_kit.py sync consumer "${{ matrix.repo }}"
      - uses: peter-evans/create-pull-request@v7
        with:
          path: consumer
          token: ${{ steps.token.outputs.token }}
          branch: embedded-agent-kit/sync
          title: "chore: sync embedded-agent-kit ${{ github.event.release.tag_name }}"
          commit-message: "chore: sync embedded-agent-kit ${{ github.event.release.tag_name }}"
          body: "Generated by embedded-pro/embedded-agent-kit. Edit the shared sections there, not here."
